esphome:
  name: esp-b
  friendly_name: esp-b
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    - priority: -100.0 # everything is initialized, system is online - if condition waits for connection
      then:
        if:
          condition:
              - wifi.connected:
          then:
            - light.turn_off: # turns off light waiting on automation to start
                id: led_ww
                transition_length: 100ms
            # - delay: 1s
            # - voice_assistant.start_continuous:
            # - delay: 1800s
            # - switch.turn_on:
            #     id: restart_switch
    - priority: 300.0 # after sensor setup, before WIFI initialization 
      then:
        - light.turn_on: # indication that the controller has power
            id: led_ww
            brightness: 100%
            red: 100%
            green: 0%
            blue: 0%
            effect: Booting

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_AUDIO_BOARD_CUSTOM: "y"
psram:
  mode: octal
  speed: 80MHz
# Enable logging
logger:
  baud_rate: 115200
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

# Enable Home Assistant API
api:
  encryption:
    key: !secret espb-api_encryption_key
  on_client_connected:
        then:
          - delay: 50ms
          - light.turn_off: led_ww
          - micro_wake_word.start:
          - speaker.volume_set: 100%

  on_client_disconnected:
        then:
          - voice_assistant.stop:

ota:
  - platform: esphome
    password: !secret espb-ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp-B Fallback Hotspot"
    password: !secret espb-ap_password

captive_portal:
web_server:
  port: 80
  include_internal: true
light:
  - platform: esp32_rmt_led_strip
    id: led_ww
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
    # rmt_channel: 0
    rmt_symbols: 96
    chipset: ws2812
    name: "on board light"
    effects:
      - pulse:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s      

# Audio and Voice Assistant Config          
i2s_audio:
  # - id: i2s_in
  #   i2s_lrclk_pin: GPIO10  #WS 
  #   i2s_bclk_pin: GPIO2 #SCK
  - id: i2s_speaker
    i2s_lrclk_pin: GPIO6  #LRC 
    i2s_bclk_pin: GPIO7 #BLCK

microphone:
  - platform: i2s_audio
    id: va_mic
    adc_type: external
    i2s_din_pin: GPIO4 #SD pin on the INMP441
    channel: left
    pdm: false
    i2s_audio_id: i2s_speaker
    bits_per_sample: 32 bit
# media_player:
#   - platform: i2s_audio
#     name: ESPHome I2S Media Player
#     dac_type: external
#     i2s_audio_id: i2s_speaker
#     i2s_dout_pin: GPIO8
speaker:
    platform: i2s_audio
    id: va_speaker
    i2s_audio_id: i2s_speaker
    dac_type: external
    i2s_dout_pin: GPIO8   #  DIN Pin of the MAX98357A Audio Amplifier
    channel: mono

micro_wake_word:
  on_wake_word_detected:
    then:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
    - light.turn_on:
        id: led_ww           
        red: 30%
        green: 30%
        blue: 70%
        brightness: 60%
        effect: fast pulse
  vad:
  models:
    - model: hey_jarvis
    
voice_assistant:
  id: va
  microphone: va_mic
  # noise_suppression_level: 2.0
  volume_multiplier: 5.0
  auto_gain: 30dBFS
  speaker: va_speaker
  on_stt_end:
      then: 
        - light.turn_off: led_ww
  on_error:
          - micro_wake_word.start:  
  on_end:
        then:
          - light.turn_off: led_ww
          - wait_until:
              not:
                voice_assistant.is_running:
          - micro_wake_word.start:
i2c:
  sda: GPIO16
  scl: GPIO15
  scan: true
  id: bus_a

# Wifi sensor that drives the UI signal strength icon
sensor:
  - platform: aht10
    variant: AHT20
    temperature:
      name: "Living Room Temperature"
    humidity:
      name: "Living Room Humidity"
    update_interval: 60s